<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Japanese New Year Shrine Festival - Mixed Modern and Traditional Clothing</title>
<style>
/* Keep the experience full-screen and lightweight. */
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07162b;font-family:Georgia,serif}
canvas{display:block;width:100%;height:100%}
.music-control{position:fixed;top:14px;right:14px;width:42px;height:42px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.28);border-radius:50%;background:rgba(8,23,43,.76);color:#fff;font-size:20px;line-height:1;cursor:pointer;backdrop-filter:blur(6px);box-shadow:0 5px 18px rgba(0,0,0,.25);transition:background .2s,transform .2s,opacity .2s}
.music-control:hover{background:rgba(215,67,62,.9);transform:scale(1.06)}
.music-control:focus-visible{outline:2px solid #ffe19a;outline-offset:3px}
.music-control[aria-pressed="false"]{opacity:.7}
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="music" class="music-control" type="button" aria-label="Turn music on" aria-pressed="false" title="Turn music on">♪</button>
<script>
// Set up a capped-resolution canvas to help slower computers.
const c=document.getElementById('c'),x=c.getContext('2d',{alpha:false}),button=document.getElementById('music');
let w,h,wind=0,nextShow=0,watchUntil=0,audio,musicTimer,musicOn=false;
const petals=[],groundPetals=[],waterPetals=[],petalClumps=[],spirits=[],people=[],rockets=[],sparks=[];
function resize(){w=Math.min(innerWidth,1600);h=Math.min(innerHeight,900);c.width=w;c.height=h}
resize();addEventListener('resize',resize);

// Restore the earlier light-pink blossom field with more visible petals and natural wind movement.
for(let i=0;i<95;i++)petals.push({x:Math.random()*w,y:Math.random()*h,s:(3.5+Math.random()*4.5)*.65,v:.65+Math.random()*1.05,a:Math.random()*Math.PI*2,flutter:Math.random()*Math.PI*2,layer:Math.random()<.84?'back':'front',destination:Math.random()<.56?'water':'ground'});
// Seed petals throughout the stream so its full visible depth feels active from the start.
for(let i=0;i<48;i++)waterPetals.push({progress:Math.random(),depthRatio:.08+Math.random()*.78,s:(3.5+Math.random()*4.5)*.65,a:Math.random()*Math.PI*2,speed:.00032+Math.random()*.0003,wobble:Math.random()*Math.PI*2});
for(let i=0;i<28;i++)spirits.push({x:Math.random()*w,y:Math.random()*h,r:2+Math.random()*2,v:.15+Math.random()*.3});

// Add solo visitors, families, and friend groups with varied visual presentation.
const colors=['#d94b55','#465fc5','#8f4aa8','#168b79','#e18b35','#bd477b','#456f9d','#b66b3d'];
const visitorPlans=[
  {type:'family',small:false,d:1,members:[{role:'adult',style:'feminine'},{role:'adult',style:'masculine'},{role:'child',style:'neutral'}]},
  {type:'friends',small:false,d:-1,members:[{role:'adult',style:'feminine'},{role:'adult',style:'neutral'},{role:'adult',style:'masculine'}]},
  {type:'family',small:true,d:1,members:[{role:'adult',style:'neutral'},{role:'adult',style:'feminine'},{role:'child',style:'masculine'},{role:'child',style:'feminine'}]},
  {type:'friends',small:true,d:-1,members:[{role:'adult',style:'neutral'},{role:'adult',style:'masculine'},{role:'adult',style:'feminine'}]},
  {type:'solo',small:false,d:1,members:[{role:'adult',style:'neutral'}]},
  {type:'solo',small:false,d:-1,members:[{role:'adult',style:'feminine'}]}
];
let visitorNumber=0;
let bellVisitor=null,bellParty=null,nextBellVisit=5000,bellSwing=0,bellRingingUntil=0;
let foodParty=null,nextFoodVisit=8000;
for(let groupIndex=0;groupIndex<visitorPlans.length;groupIndex++){
  const plan=visitorPlans[groupIndex];
  const groupId=`group-${groupIndex}`;
  const groupSpeed=(plan.small?.64:.92)+Math.random()*.34;
  const groupWatches=Math.random()<.58;
  const baseX=Math.random()*w;
  plan.members.forEach((member,memberIndex)=>{
    const child=member.role==='child';
    const baseScale=plan.small?.55:1;
    const scale=baseScale*(child?.62:1);
    people.push({
      x:baseX-memberIndex*34*baseScale*plan.d,
      scale,
      ground:plan.small?.705:.745,
      d:plan.d,
      v:groupSpeed,
      currentSpeed:groupSpeed,
      brake:.018+Math.random()*.012,
      acceleration:.012+Math.random()*.012,
      c:colors[visitorNumber++%colors.length],
      watch:groupWatches,
      step:Math.random()*Math.PI*2,
      groupId,
      groupType:plan.type,
      memberIndex,
      role:member.role,
      style:member.style,
      outfit:Math.random()<.42?(Math.random()<.55?'yukata':'kimono'):(Math.random()<.5?'tshirt':'jacket'),
      pantsColor:['#27364a','#4b433d','#36516b','#2c2c35'][visitorNumber%4]
    });
  });
}

// Schedule coordinated fireworks at random intervals from one to twenty seconds.
function schedule(now){nextShow=now+1000+Math.random()*19000}
function show(now){
  const n=4+Math.floor(Math.random()*4);watchUntil=now+3900;
  for(let i=0;i<n;i++){
    const tx=w*(.1+.8*(i+.5)/n)+(Math.random()-.5)*55;
    rockets.push({x:tx,y:h+8,tx,ty:h*(.12+Math.random()*.34),v:6+Math.random()*2,c:`hsl(${Math.random()*360},100%,68%)`,delay:i*160,born:now});
  }
  schedule(now);
}
function burst(r){
  if(sparks.length>400)sparks.splice(0,sparks.length-400);
  const n=26+Math.floor(Math.random()*17);
  for(let i=0;i<n;i++){
    const a=Math.PI*2*i/n,s=1.4+Math.random()*3.5;
    sparks.push({x:r.x,y:r.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:45+Math.random()*20,m:65,c:r.c});
  }
}

// Play a calmer festival-inspired arrangement with separate taiko and flute phrases.
function tone(hz,start,length,gain,type='sine'){
  const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(hz,start);g.gain.setValueAtTime(gain,start);g.gain.exponentialRampToValueAtTime(.001,start+length);o.connect(g).connect(audio.destination);o.start(start);o.stop(start+length);
}

// Play one flute note with a gentle attack and release so adjacent notes crossfade smoothly.
function legatoFlute(hz,start,length,gain){
  const oscillator=audio.createOscillator();
  const level=audio.createGain();
  const filter=audio.createBiquadFilter();
  oscillator.type='sine';
  oscillator.frequency.setValueAtTime(hz,start);
  filter.type='lowpass';filter.frequency.setValueAtTime(2400,start);filter.Q.value=.7;
  level.gain.setValueAtTime(.0001,start);
  level.gain.linearRampToValueAtTime(gain,start+.08);
  level.gain.setValueAtTime(gain,start+Math.max(.09,length-.14));
  level.gain.linearRampToValueAtTime(.0001,start+length);
  oscillator.connect(filter).connect(level).connect(audio.destination);
  oscillator.start(start);oscillator.stop(start+length+.02);
}

// Create a short filtered noise burst for drum attacks and wooden rim sounds.
function noiseBurst(start,length,gain,filterFrequency){
  const sampleCount=Math.max(1,Math.floor(audio.sampleRate*length));
  const buffer=audio.createBuffer(1,sampleCount,audio.sampleRate);
  const data=buffer.getChannelData(0);
  for(let i=0;i<sampleCount;i++)data[i]=(Math.random()*2-1)*(1-i/sampleCount);
  const source=audio.createBufferSource(),filter=audio.createBiquadFilter(),level=audio.createGain();
  source.buffer=buffer;filter.type='bandpass';filter.frequency.setValueAtTime(filterFrequency,start);filter.Q.value=1.2;
  level.gain.setValueAtTime(gain,start);level.gain.exponentialRampToValueAtTime(.001,start+length);
  source.connect(filter).connect(level).connect(audio.destination);source.start(start);source.stop(start+length);
}

// Synthesize a deep o-daiko with a low body, pitch drop, and soft skin attack.
function oDaiko(start,accent=1){
  const oscillator=audio.createOscillator(),level=audio.createGain();
  oscillator.type='sine';oscillator.frequency.setValueAtTime(78,start);oscillator.frequency.exponentialRampToValueAtTime(34,start+.44);
  level.gain.setValueAtTime(.36*accent,start);level.gain.exponentialRampToValueAtTime(.001,start+.62);
  oscillator.connect(level).connect(audio.destination);oscillator.start(start);oscillator.stop(start+.64);
  noiseBurst(start,.042,.06*accent,135);
}

// Synthesize a medium chu-daiko with a shorter, firmer body.
function chuDaiko(start,accent=1){
  const oscillator=audio.createOscillator(),level=audio.createGain();
  oscillator.type='sine';oscillator.frequency.setValueAtTime(122,start);oscillator.frequency.exponentialRampToValueAtTime(52,start+.26);
  level.gain.setValueAtTime(.25*accent,start);level.gain.exponentialRampToValueAtTime(.001,start+.39);
  oscillator.connect(level).connect(audio.destination);oscillator.start(start);oscillator.stop(start+.41);
  noiseBurst(start,.032,.064*accent,205);
}

// Synthesize a tight shime-daiko accent with a higher tuned body.
function shimeDaiko(start,accent=1){
  const oscillator=audio.createOscillator(),level=audio.createGain();
  oscillator.type='triangle';oscillator.frequency.setValueAtTime(210,start);oscillator.frequency.exponentialRampToValueAtTime(112,start+.12);
  level.gain.setValueAtTime(.13*accent,start);level.gain.exponentialRampToValueAtTime(.001,start+.19);
  oscillator.connect(level).connect(audio.destination);oscillator.start(start);oscillator.stop(start+.21);
  noiseBurst(start,.024,.058*accent,560);
}

// Synthesize a dry wooden rim strike for the traditional ka-style counter-rhythm.
function rimStrike(start,accent=1){
  noiseBurst(start,.036,.085*accent,1450);
  tone(920,start,.03,.026*accent,'square');
}

let phrase=0;
const taikoPatterns=[
  [[0,'o',1.05],[.28,'rim',.8],[.58,'chu',1],[.8,'shime',.8],[0.9275,'rim',.75],[1.1594,'o',1],[1.5569,'chu',.95],[1.7888,'rim',.8],[2.0537,'shime',.9],[2.3353,'chu',1]],
  [[0,'o',1.08],[.36,'chu',.9],[.66,'rim',.8],[.94,'chu',1],[1.0766,'shime',.85],[1.3084,'rim',.75],[1.5569,'o',1],[1.8716,'chu',.92],[2.1366,'shime',.8],[2.4016,'rim',.8]],
  [[0,'chu',.95],[.24,'rim',.78],[.48,'shime',.85],[.78,'o',1.08],[0.9772,'rim',.75],[1.2919,'chu',1],[1.5072,'shime',.82],[1.7225,'rim',.82],[1.9709,'o',1],[2.3022,'chu',.9]],
  [[0,'o',1.08],[.34,'rim',.8],[.68,'chu',.95],[0.8447,'rim',.75],[1.1428,'o',1],[1.4575,'shime',.85],[1.6562,'shime',.78],[1.8716,'chu',.95],[2.1034,'rim',.8],[2.3684,'o',1.02]]
];

// Play one of the four drum voices with a subtle human volume variation.
function playTaikoVoice(name,start,accent){
  const humanizedAccent=accent*(.94+Math.random()*.12);
  if(name==='o')oDaiko(start,humanizedAccent);
  else if(name==='chu')chuDaiko(start,humanizedAccent);
  else if(name==='shime')shimeDaiko(start,humanizedAccent);
  else rimStrike(start,humanizedAccent);
}

function playMusic(){
  if(!audio)return;
  const start=audio.currentTime+.04;
  const pattern=taikoPatterns[phrase%taikoPatterns.length];
  pattern.forEach(([offset,voice,accent])=>playTaikoVoice(voice,start+offset+(Math.random()-.5)*.01,accent));

  // Add a compact fill at the end of every fourth phrase.
  if(phrase%4===3){
    shimeDaiko(start+2.2,.7);shimeDaiko(start+2.3,.78);chuDaiko(start+2.4,.9);oDaiko(start+2.52,1.04);
  }

  // Use connected flute phrases whose notes overlap slightly for uninterrupted legato motion.
  const flutePhrases=[
    [[523.25,.72],[659.25,.68],[783.99,.86],[659.25,.76],[587.33,.62]],
    [[587.33,.66],[698.46,.76],[659.25,.7],[523.25,.84],[587.33,.68]],
    [[659.25,.78],[783.99,.68],[880,.76],[783.99,.66],[659.25,.72]],
    [[523.25,.62],[587.33,.66],[659.25,.74],[783.99,.82],[698.46,.64]],
    [[783.99,.7],[659.25,.66],[587.33,.72],[523.25,.8],[659.25,.68]]
  ];
  const flute=flutePhrases[phrase%flutePhrases.length];
  let fluteOffset=.1;
  flute.forEach(([note,duration],index)=>{
    const gentleVariation=1+(Math.random()-.5)*.008;
    const overlap=.12;
    legatoFlute(note*gentleVariation,start+fluteOffset,duration+overlap,.0185+(index===0?.0025:0));
    fluteOffset+=duration;
  });
  phrase++;
}
button.onclick=async()=>{
  if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();await audio.resume();musicOn=!musicOn;
  if(musicOn){
    playMusic();musicTimer=setInterval(playMusic,2650);
    button.textContent='♫';button.setAttribute('aria-pressed','true');button.setAttribute('aria-label','Turn music off');button.title='Turn music off';
  }else{
    clearInterval(musicTimer);
    button.textContent='♪';button.setAttribute('aria-pressed','false');button.setAttribute('aria-label','Turn music on');button.title='Turn music on';
  }
};

// Draw the restored blossom as a clearly visible, light-pink five-petal flower.
function drawPetal(p){
  x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle='rgba(255,225,236,.98)';
  for(let i=0;i<5;i++){
    x.beginPath();x.ellipse(0,p.s*.58,p.s*.48,p.s,0,0,Math.PI*2);x.fill();x.rotate(Math.PI*2/5);
  }
  x.fillStyle='rgba(255,245,248,.95)';x.beginPath();x.arc(0,0,p.s*.28,0,Math.PI*2);x.fill();x.restore();
}

// Return a point on the exact two-part quadratic curve used to draw the stream's upper edge.
function streamCurvePoint(progress){
  const u=Math.max(0,Math.min(1,progress));
  let t,p0x,p0y,p1x,p1y,p2x,p2y;
  if(u<.5){
    t=u*2;p0x=0;p0y=h*.87;p1x=w*.34;p1y=h*.76;p2x=w*.58;p2y=h*.86;
  }else{
    t=(u-.5)*2;p0x=w*.58;p0y=h*.86;p1x=w*.8;p1y=h*.97;p2x=w;p2y=h*.83;
  }
  const mt=1-t;
  return {x:mt*mt*p0x+2*mt*t*p1x+t*t*p2x,y:mt*mt*p0y+2*mt*t*p1y+t*t*p2y};
}

// Reset a falling blossom above the scene after it lands.
function resetPetal(p){
  p.x=Math.random()*w;p.y=-18-Math.random()*90;p.a=Math.random()*Math.PI*2;p.flutter=Math.random()*Math.PI*2;
  p.layer=Math.random()<.48?'back':'front';p.destination=Math.random()<.34?'water':'ground';
}

// Create clumps at random dry-ground positions rather than fixed locations.
function randomClump(){
  const clump={x:w*(.04+Math.random()*.92),y:h*(.715+Math.random()*.048),radius:20+Math.random()*46,capacity:8+Math.floor(Math.random()*20),count:0};
  petalClumps.push(clump);if(petalClumps.length>14)petalClumps.shift();return clump;
}

// Add a petal to a random ground clump while retaining its already reduced size.
function settleOnGround(p){
  const open=petalClumps.filter(c=>c.count<c.capacity);
  const clump=open.length&&Math.random()<.72?open[Math.floor(Math.random()*open.length)]:randomClump();
  const angle=Math.random()*Math.PI*2,distance=Math.sqrt(Math.random())*clump.radius;
  groundPetals.push({x:Math.max(6,Math.min(w-6,clump.x+Math.cos(angle)*distance)),y:clump.y+Math.sin(angle)*distance*.18,s:p.s,a:Math.random()*Math.PI*2,alpha:.72+Math.random()*.24});
  clump.count++;if(groundPetals.length>145)groundPetals.shift();resetPetal(p);
}

// Convert the petal's horizontal position into progress along the exact stream curve.
function enterStream(p){
  waterPetals.push({progress:Math.max(0,Math.min(1,p.x/w)),depthRatio:.08+Math.random()*.78,s:p.s,a:p.a,speed:.00032+Math.random()*.0003,wobble:Math.random()*Math.PI*2});
  if(waterPetals.length>115)waterPetals.shift();resetPetal(p);
}

// Draw a single settled petal using the same approved pale-pink palette.
function drawSettledPetal(p,alpha=1){
  x.save();x.translate(p.x,p.y);x.rotate(p.a);x.globalAlpha=alpha;x.fillStyle='rgba(255,225,236,.98)';
  x.beginPath();x.ellipse(0,0,p.s,p.s*.5,0,0,Math.PI*2);x.fill();x.globalAlpha=1;x.restore();
}

// Play a restrained bronze shrine-bell tone when a visitor pulls the rope.
function shrineBellSound(){
  if(!audio||!musicOn)return;
  const start=audio.currentTime+.02;
  [[392,.055],[523.25,.03],[659.25,.018]].forEach(([hz,gain])=>{
    const oscillator=audio.createOscillator(),level=audio.createGain();
    oscillator.type='sine';oscillator.frequency.setValueAtTime(hz,start);
    level.gain.setValueAtTime(gain,start);level.gain.exponentialRampToValueAtTime(.0001,start+2.6);
    oscillator.connect(level).connect(audio.destination);oscillator.start(start);oscillator.stop(start+2.7);
  });
}

// Draw a compact central shrine facade, braided bell rope, and bronze bell.
function drawCentralShrine(now){
  const cx=w*.5,base=h*.69,ringing=now<bellRingingUntil;
  bellSwing=ringing?Math.sin(now/65)*.12:bellSwing*.9;
  x.save();
  // Timber shrine structure and roof.
  x.fillStyle='#241a18';x.fillRect(cx-w*.13,base-h*.2,w*.26,h*.2);
  x.fillStyle='#3a2720';x.beginPath();x.moveTo(cx-w*.17,base-h*.2);x.lineTo(cx-w*.11,base-h*.255);x.lineTo(cx+w*.11,base-h*.255);x.lineTo(cx+w*.17,base-h*.2);x.closePath();x.fill();
  x.fillStyle='#151010';x.fillRect(cx-w*.075,base-h*.155,w*.15,h*.155);
  x.strokeStyle='#6f4a2e';x.lineWidth=7;x.strokeRect(cx-w*.13,base-h*.2,w*.26,h*.2);
  // Sacred rope, tassels, and paper streamers.
  x.strokeStyle='#c8953f';x.lineWidth=10;x.beginPath();x.moveTo(cx-w*.115,base-h*.185);x.quadraticCurveTo(cx,base-h*.16,cx+w*.115,base-h*.185);x.stroke();
  for(const side of [-1,1]){x.fillStyle='#d59a38';x.beginPath();x.moveTo(cx+side*w*.07,base-h*.17);x.lineTo(cx+side*w*.055,base-h*.115);x.lineTo(cx+side*w*.085,base-h*.115);x.closePath();x.fill()}
  x.fillStyle='#f7f4e8';for(const side of [-1,1]){x.fillRect(cx+side*w*.102-4,base-h*.17,8,26);x.fillRect(cx+side*w*.094-4,base-h*.145,8,18)}
  // Bell and pull rope.
  x.save();x.translate(cx,base-h*.135);x.rotate(bellSwing);x.fillStyle='#9b5d35';x.beginPath();x.ellipse(0,0,13,17,0,0,Math.PI*2);x.fill();x.fillStyle='#6f3826';x.fillRect(-14,10,28,5);x.restore();
  x.strokeStyle='#d7c39b';x.lineWidth=6;x.beginPath();x.moveTo(cx,base-h*.12);x.lineTo(cx,base-h*.015);x.stroke();
  x.fillStyle='#d7c39b';x.fillRect(cx-9,base-h*.035,18,22);
  x.restore();
}

// Draw a compact festival food stall beside each side of the torii entrance.
function drawFoodStall(centerX,baseY,awningColor,accentColor){
  x.save();x.shadowBlur=0;x.globalAlpha=1;
  // Timber counter and side posts.
  x.fillStyle='#34251d';x.fillRect(centerX-55,baseY-82,110,82);
  x.fillStyle='#5a3825';x.fillRect(centerX-61,baseY-88,8,88);x.fillRect(centerX+53,baseY-88,8,88);
  x.fillStyle='#7a4930';x.fillRect(centerX-58,baseY-31,116,16);
  // Alternating fabric awning panels.
  for(let i=0;i<6;i++){
    x.fillStyle=i%2?accentColor:awningColor;
    x.fillRect(centerX-60+i*20,baseY-102,20,25);
  }
  x.fillStyle='#281c18';x.fillRect(centerX-65,baseY-108,130,8);
  // Warm lanterns and soft pools of light.
  for(const side of [-1,1]){
    x.shadowBlur=10;x.shadowColor='#ffb347';x.fillStyle='#f2a640';
    x.beginPath();x.ellipse(centerX+side*43,baseY-69,8,12,0,0,Math.PI*2);x.fill();
  }
  x.shadowBlur=0;
  // Steam and simple serving dishes, without readable signage.
  x.strokeStyle='rgba(245,245,230,.52)';x.lineWidth=2;
  for(let i=0;i<3;i++){
    x.beginPath();x.moveTo(centerX-18+i*18,baseY-38);x.quadraticCurveTo(centerX-24+i*18,baseY-51,centerX-17+i*18,baseY-63);x.stroke();
  }
  x.fillStyle='#ddd2bd';x.beginPath();x.ellipse(centerX,baseY-27,28,6,0,0,Math.PI*2);x.fill();
  x.restore();
}

// Draw both stalls outside the torii posts, leaving the center path and bell rope clear.
function drawFoodStalls(){
  const base=h*.69;
  // Keep the original two stalls beside the torii entrance.
  drawFoodStall(w*.255,base,'#b93432','#f5e6cf');
  drawFoodStall(w*.745,base,'#315f8d','#f5e6cf');
  // Add two smaller-looking outer stalls by placing them farther into the background edges.
  x.save();
  x.translate(w*.105,base);x.scale(.78,.78);x.translate(-w*.105,-base);
  drawFoodStall(w*.105,base,'#ca7a29','#f5e6cf');
  x.restore();
  x.save();
  x.translate(w*.895,base);x.scale(.78,.78);x.translate(-w*.895,-base);
  drawFoodStall(w*.895,base,'#6b458f','#f5e6cf');
  x.restore();
}

// Draw a small wrapped snack after a visitor finishes buying food.
function drawCarriedFood(p){
  if(!p.hasFood)return;
  const groundY=h*p.ground,s=p.scale;
  x.save();x.translate(p.x,groundY);x.scale(p.d*s,s);
  x.fillStyle='#f2dfb2';x.fillRect(13,-31,8,11);
  x.fillStyle='#bd5a36';x.beginPath();x.arc(17,-32,4,0,Math.PI*2);x.fill();
  x.restore();
}

// Draw each visitor with grounded feet and a mix of modern and traditional clothing.
function person(p,watching){
  const groundY=h*p.ground,s=p.scale;
  x.save();x.translate(p.x,groundY);x.scale(p.d*s,s);
  const swing=watching?0:Math.sin(p.step)*3,child=p.role==='child';
  const headY=child?-47:-55,look=watching?3:0;

  if(p.outfit==='yukata'||p.outfit==='kimono'){
    const bodyTop=child?-38:-46,hem=child?13:15;
    // Draw a long traditional robe and sleeves.
    x.fillStyle=p.c;x.beginPath();x.moveTo(-12,bodyTop);x.lineTo(12,bodyTop);x.lineTo(hem,-2);x.lineTo(-hem,-2);x.closePath();x.fill();
    x.strokeStyle=p.c;x.lineWidth=child?6:7;x.beginPath();x.moveTo(-10,bodyTop+9);x.lineTo(-19,bodyTop+25);x.moveTo(10,bodyTop+9);x.lineTo(19,bodyTop+25);x.stroke();
    // Add a contrasting obi and subtle robe pattern.
    x.fillStyle=p.outfit==='kimono'?'#f2d17e':'#e8e1c9';x.fillRect(-13,bodyTop+19,26,6);
    x.fillStyle='rgba(255,255,255,.38)';for(let i=0;i<3;i++){x.beginPath();x.arc(-7+i*7,bodyTop+31+i%2*5,1.8,0,Math.PI*2);x.fill()}
    x.strokeStyle='#261b20';x.lineWidth=3;x.beginPath();x.moveTo(-4,-3);x.lineTo(-5+swing,0);x.moveTo(4,-3);x.lineTo(5-swing,0);x.stroke();
  }else{
    const shirtTop=child?-36:-43,waist=child?-18:-21;
    // Draw visible pants and walking legs for the modern outfit.
    x.strokeStyle=p.pantsColor;x.lineWidth=7;x.beginPath();x.moveTo(-4,waist);x.lineTo(-5+swing,0);x.moveTo(4,waist);x.lineTo(5-swing,0);x.stroke();
    // Draw a T-shirt or short jacket above the pants.
    x.fillStyle=p.c;x.fillRect(-11,shirtTop,22,shirtTop*-1+waist);
    x.strokeStyle=p.c;x.lineWidth=6;x.beginPath();x.moveTo(-9,shirtTop+8);x.lineTo(-16,shirtTop+18);x.moveTo(9,shirtTop+8);x.lineTo(16,shirtTop+18);x.stroke();
    if(p.outfit==='jacket'){
      x.strokeStyle='#e8dfcf';x.lineWidth=2;x.beginPath();x.moveTo(0,shirtTop);x.lineTo(0,waist);x.stroke();
      x.fillStyle='#d7d1c5';x.fillRect(-12,shirtTop-3,24,4);
    }else{
      x.fillStyle='#e8dfcf';x.beginPath();x.arc(0,shirtTop+2,3,0,Math.PI);x.fill();
    }
    x.fillStyle='#1f2732';x.fillRect(-8,-2,7,3);x.fillRect(2,-2,7,3);
  }

  // Draw the face and varied hair shapes.
  x.fillStyle='#f2c8ad';x.beginPath();x.arc(look,headY,8,0,Math.PI*2);x.fill();x.fillStyle='#241b20';
  if(p.style==='feminine'){
    x.beginPath();x.arc(look,headY-4,8.5,Math.PI,Math.PI*2);x.fill();x.beginPath();x.arc(look-7,headY+1,3.5,0,Math.PI*2);x.arc(look+7,headY+1,3.5,0,Math.PI*2);x.fill();
  }else if(p.style==='masculine'){
    x.beginPath();x.arc(look,headY-4.5,8.3,Math.PI,Math.PI*2);x.fill();x.fillRect(look-8,headY-5,16,3);
  }else{
    x.beginPath();x.arc(look,headY-4,8.4,Math.PI*.92,Math.PI*2.08);x.fill();x.fillRect(look-8,headY-3,3,8);
  }
  x.restore();
}

// Render and animate the shrine scene.
function frame(now){
  if(!nextShow)schedule(now);if(now>=nextShow)show(now);wind=Math.sin(now/2400)*1.3;
  let g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,'#06142b');g.addColorStop(.58,'#24434a');g.addColorStop(1,'#789268');x.fillStyle=g;x.fillRect(0,0,w,h);
  // Draw fireworks directly over the sky, before mountains and scenery, so they remain in the background.
  for(let i=rockets.length-1;i>=0;i--){const r=rockets[i];if(now-r.born<r.delay)continue;const dx=r.tx-r.x,dy=r.ty-r.y,d=Math.hypot(dx,dy);if(d<r.v+2){burst(r);rockets.splice(i,1);continue}r.x+=dx/d*r.v;r.y+=dy/d*r.v;x.fillStyle=r.c;x.fillRect(r.x-2,r.y-2,4,8)}
  x.globalCompositeOperation='lighter';
  for(let i=sparks.length-1;i>=0;i--){const s=sparks[i];s.x+=s.vx;s.y+=s.vy;s.vx*=.985;s.vy=s.vy*.985+.035;s.l--;x.globalAlpha=Math.max(0,s.l/s.m);x.fillStyle=s.c;x.fillRect(s.x,s.y,2,2);if(s.l<=0)sparks.splice(i,1)}
  x.globalAlpha=1;x.globalCompositeOperation='source-over';

  x.fillStyle='#19333c';x.beginPath();x.moveTo(0,h*.59);x.lineTo(w*.2,h*.36);x.lineTo(w*.4,h*.59);x.lineTo(w*.6,h*.32);x.lineTo(w*.82,h*.59);x.lineTo(w,h*.4);x.lineTo(w,h*.74);x.lineTo(0,h*.74);x.fill();
  x.fillStyle='#433a26';x.fillRect(0,h*.69,w,h*.31);
  let q=x.createLinearGradient(0,h*.78,0,h);q.addColorStop(0,'#4693b4');q.addColorStop(1,'#173c61');x.fillStyle=q;x.beginPath();x.moveTo(0,h*.87);x.quadraticCurveTo(w*.34,h*.76,w*.58,h*.86);x.quadraticCurveTo(w*.8,h*.97,w,h*.83);x.lineTo(w,h);x.lineTo(0,h);x.fill();
  // Draw rocks along the exact shoreline without leaking drawing state into petals or spirits.
  x.save();
  const rockProgress=[.02,.1,.19,.29,.4,.51,.62,.73,.84,.94];
  for(let i=0;i<rockProgress.length;i++){
    const point=streamCurvePoint(rockProgress[i]);
    const rw=14+(i*7%15),rh=8+(i*5%8);
    x.globalAlpha=1;x.shadowBlur=0;
    x.fillStyle=i%2?'#77776f':'#99988d';x.beginPath();
    x.ellipse(point.x,point.y+rh*.24,rw,rh,-.18+Math.sin(i)*.13,0,Math.PI*2);x.fill();
    x.fillStyle='rgba(210,218,210,.22)';x.beginPath();
    x.ellipse(point.x-rw*.18,point.y-rh*.12,rw*.46,rh*.24,-.18,0,Math.PI*2);x.fill();
  }
  x.restore();
  // Draw the central shrine and side food stalls before the torii and visitors.
  drawCentralShrine(now);
  drawFoodStalls();
  // Draw the torii gate afterward as the foreground entrance to the shrine.
  x.save();
  x.strokeStyle='#c8322e';x.lineWidth=16;x.beginPath();x.moveTo(w*.4,h*.69);x.lineTo(w*.4,h*.38);x.moveTo(w*.6,h*.69);x.lineTo(w*.6,h*.38);x.moveTo(w*.32,h*.43);x.lineTo(w*.68,h*.43);x.stroke();x.lineWidth=10;x.beginPath();x.moveTo(w*.28,h*.36);x.lineTo(w*.72,h*.36);x.stroke();
  x.restore();
  const active=now<watchUntil||rockets.length||sparks.length>8;
  // Update falling petals and transfer them to ground clumps or the stream.
  for(const p of petals){
    p.flutter+=.035;p.x+=wind+Math.sin(p.flutter)*.7;p.y+=p.v;p.a+=.018+wind*.004;
    if(p.x>w+18)p.x=-18;if(p.x<-18)p.x=w+18;
    const curve=streamCurvePoint(Math.max(0,Math.min(1,p.x/w)));
    if(p.destination==='water'&&p.y>=curve.y)enterStream(p);
    else if(p.destination==='ground'&&p.y>=h*.735)settleOnGround(p);
  }
  // Draw background blossoms before the people.
  for(const p of petals.filter(p=>p.layer==='back')){x.save();x.globalAlpha=.5;drawPetal(p);x.restore()}
  // Draw near airborne petals before visitors so they provide depth without obscuring anyone.
  for(const p of petals.filter(p=>p.layer==='front')){x.save();x.globalAlpha=.48;drawPetal(p);x.restore()}
  // Update people once and draw them in depth order.
  // Calculate one shared speed per family or friend group so members stay together.
  // Occasionally choose either one solo visitor or an entire family/friend group to buy food.
  if(!foodParty&&now>nextFoodVisit){
    const availableGroups=[...new Set(people.filter(person=>person!==bellVisitor&&!(bellParty&&bellParty.members.includes(person))).map(person=>person.groupId))];
    if(availableGroups.length){
      const groupId=availableGroups[Math.floor(Math.random()*availableGroups.length)];
      const members=people.filter(person=>person.groupId===groupId).sort((a,b)=>a.memberIndex-b.memberIndex);
      const center=members.reduce((sum,person)=>sum+person.x,0)/members.length;
      const stallPositions=[w*.105,w*.255,w*.745,w*.895];
      const stallX=stallPositions.reduce((nearest,position)=>Math.abs(position-center)<Math.abs(nearest-center)?position:nearest,stallPositions[0]);
      foodParty={members,state:'approach',stallX,resumeDirection:members[0].d};
      members.forEach((person,index)=>{person.foodOffset=(index-(members.length-1)/2)*24*person.scale;person.hasFood=false});
    }
    nextFoodVisit=now+12000+Math.random()*16000;
  }
  if(foodParty){
    const party=foodParty;
    if(party.state==='approach'){
      let arrived=true;
      party.members.forEach(person=>{
        const target=party.stallX+person.foodOffset,dx=target-person.x;person.d=dx>=0?1:-1;
        person.currentSpeed=Math.min(person.v,Math.max(.3,Math.abs(dx)/130));
        person.x+=Math.sign(dx)*Math.min(Math.abs(dx),person.currentSpeed);person.step+=.12;
        if(Math.abs(dx)>=3)arrived=false;
      });
      if(arrived){party.state='buy';party.buyEnd=now+1800;party.members.forEach(person=>person.currentSpeed=0)}
    }else if(party.state==='buy'){
      party.members.forEach(person=>{person.currentSpeed=0;person.isWatching=true});
      if(now>party.buyEnd){party.state='return';party.returnCenter=party.stallX-party.resumeDirection*110;party.members.forEach(person=>person.hasFood=true)}
    }else{
      let returned=true;
      party.members.forEach(person=>{
        const target=party.returnCenter+person.foodOffset,dx=target-person.x;person.d=dx>=0?1:-1;
        person.currentSpeed=Math.min(person.v,person.currentSpeed+.02);
        person.x+=Math.sign(dx)*Math.min(Math.abs(dx),person.currentSpeed);person.step+=.12;
        if(Math.abs(dx)>=3)returned=false;
      });
      if(returned){party.members.forEach(person=>{person.d=party.resumeDirection;delete person.foodOffset});foodParty=null}
    }
  }
  // Alternate between an individual bell visit and a family/friend group visit.
  if(!bellVisitor&&!bellParty&&now>nextBellVisit){
    const chooseGroup=Math.random()<.58;
    if(chooseGroup){
      const ids=[...new Set(people.filter(p=>p.groupType!=='solo'&&!(foodParty&&foodParty.members.includes(p))).map(p=>p.groupId))];
      if(ids.length){
        const groupId=ids[Math.floor(Math.random()*ids.length)];
        const members=people.filter(p=>p.groupId===groupId).sort((a,b)=>a.memberIndex-b.memberIndex);
        bellParty={members,state:'approach',resumeDirection:members[0].d};
        members.forEach((person,index)=>person.bellOffset=(index-(members.length-1)/2)*23*person.scale);
      }
    }
    if(!bellParty){
      const candidates=people.filter(p=>p.groupType==='solo'&&p.role==='adult'&&!(foodParty&&foodParty.members.includes(p)));
      if(candidates.length){bellVisitor=candidates[Math.floor(Math.random()*candidates.length)];bellVisitor.bellState='approach';bellVisitor.resumeDirection=bellVisitor.d}
    }
    nextBellVisit=now+14000+Math.random()*16000;
  }
  // Keep the original individual bell behavior.
  if(bellVisitor){
    const targetX=w*.5;
    if(bellVisitor.bellState==='approach'){
      const dx=targetX-bellVisitor.x;bellVisitor.d=dx>=0?1:-1;bellVisitor.currentSpeed=Math.min(bellVisitor.v,Math.max(.35,Math.abs(dx)/120));
      bellVisitor.x+=Math.sign(dx)*Math.min(Math.abs(dx),bellVisitor.currentSpeed);bellVisitor.step+=.13;
      if(Math.abs(dx)<3){bellVisitor.bellState='ring';bellVisitor.ringEnd=now+1300;bellRingingUntil=now+900;shrineBellSound()}
    }else if(bellVisitor.bellState==='ring'){
      bellVisitor.currentSpeed=0;bellVisitor.isWatching=true;
      if(now>bellVisitor.ringEnd){bellVisitor.bellState='return';bellVisitor.returnTarget=targetX-bellVisitor.resumeDirection*95}
    }else{
      const dx=bellVisitor.returnTarget-bellVisitor.x;bellVisitor.d=dx>=0?1:-1;bellVisitor.currentSpeed=Math.min(bellVisitor.v,bellVisitor.currentSpeed+.02);
      bellVisitor.x+=Math.sign(dx)*Math.min(Math.abs(dx),bellVisitor.currentSpeed);bellVisitor.step+=.13;
      if(Math.abs(dx)<3){bellVisitor.d=bellVisitor.resumeDirection;delete bellVisitor.bellState;bellVisitor=null}
    }
  }
  // Move a chosen group to the bell, ring once collectively, then restore formation.
  if(bellParty){
    const party=bellParty,targetCenter=w*.5;
    if(party.state==='approach'){
      let arrived=true;
      party.members.forEach(person=>{
        const target=targetCenter+person.bellOffset,dx=target-person.x;person.d=dx>=0?1:-1;
        person.currentSpeed=Math.min(person.v,Math.max(.32,Math.abs(dx)/120));person.x+=Math.sign(dx)*Math.min(Math.abs(dx),person.currentSpeed);person.step+=.13;
        if(Math.abs(dx)>=3)arrived=false;
      });
      if(arrived){party.state='ring';party.ringEnd=now+1500;party.members.forEach(person=>{person.currentSpeed=0;person.isWatching=true});bellRingingUntil=now+900;shrineBellSound()}
    }else if(party.state==='ring'){
      party.members.forEach(person=>{person.currentSpeed=0;person.isWatching=true});
      if(now>party.ringEnd){party.state='return';party.returnCenter=targetCenter-party.resumeDirection*115}
    }else{
      let returned=true;
      party.members.forEach(person=>{
        const target=party.returnCenter+person.bellOffset,dx=target-person.x;person.d=dx>=0?1:-1;
        person.currentSpeed=Math.min(person.v,person.currentSpeed+.02);person.x+=Math.sign(dx)*Math.min(Math.abs(dx),person.currentSpeed);person.step+=.13;
        if(Math.abs(dx)>=3)returned=false;
      });
      if(returned){party.members.forEach(person=>{person.d=party.resumeDirection;delete person.bellOffset});bellParty=null}
    }
  }
  const groupStates=new Map();
  for(const p of people){
    if(p===bellVisitor||(bellParty&&bellParty.members.includes(p))||(foodParty&&foodParty.members.includes(p)))continue;
    if(!groupStates.has(p.groupId))groupStates.set(p.groupId,{speed:p.currentSpeed,target:active&&p.watch?0:p.v,brake:p.brake,acceleration:p.acceleration});
  }
  for(const state of groupStates.values()){
    if(state.target===0)state.speed=Math.max(0,state.speed-state.brake);
    else state.speed=Math.min(state.target,state.speed+state.acceleration);
  }
  for(const p of people){
    if(p===bellVisitor||(bellParty&&bellParty.members.includes(p))||(foodParty&&foodParty.members.includes(p)))continue;
    const state=groupStates.get(p.groupId);
    p.currentSpeed=state.speed;
    p.x+=p.currentSpeed*p.d;
    p.step+=.16*(p.currentSpeed/Math.max(.01,p.v));
    p.isWatching=active&&p.watch&&p.currentSpeed<.08;
    if(p.x>w+90)p.x=-90;if(p.x<-90)p.x=w+90;
  }
  for(const p of people.filter(visitor=>visitor.scale<1)){person(p,p.isWatching);drawCarriedFood(p)}
  for(const p of people.filter(visitor=>visitor.scale>=1)){person(p,p.isWatching);drawCarriedFood(p)}
  // Draw randomly distributed ground clumps on top of the ground rather than hiding them beneath it.
  for(const p of groundPetals)drawSettledPetal(p,p.alpha);
  // Follow the exact quadratic stream curve, with a small inward offset that keeps petals visibly on the water.
  for(let i=waterPetals.length-1;i>=0;i--){
    const p=waterPetals[i];p.progress+=p.speed;p.wobble+=.025;const point=streamCurvePoint(p.progress);
    const availableDepth=Math.max(14,h-point.y-8);p.x=point.x;p.y=point.y+availableDepth*p.depthRatio+Math.sin(p.wobble)*2;p.a+=.01;drawSettledPetal(p,.9);
    if(p.progress>1)waterPetals.splice(i,1);
  }
  // Draw foreground blossoms last so they visibly pass in front of the people.
  // All airborne petals have already been rendered behind the visitors.
  // Draw each spirit with a warm yellow halo and a clearly visible white center.
  for(const s of spirits){s.y-=s.v;s.x+=wind*.09;if(s.y<0)s.y=h;if(s.x>w+10)s.x=-10;if(s.x<-10)s.x=w+10;x.shadowBlur=10;x.shadowColor='#ffd84c';x.fillStyle='#ffd84c';x.beginPath();x.arc(s.x,s.y,s.r+1,0,Math.PI*2);x.fill();x.shadowBlur=0;x.fillStyle='#ffffff';x.beginPath();x.arc(s.x,s.y,Math.max(1.2,s.r*.55),0,Math.PI*2);x.fill()}
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
